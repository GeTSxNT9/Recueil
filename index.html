<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recueil</title>
<meta name="description" content="Recueil: recetas para cocinar con calma.">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>try{var t=localStorage.getItem('tema')||(matchMedia('(prefers-color-scheme: dark)').matches?'oscuro':'claro');document.documentElement.dataset.tema=t}catch(e){}</script>
</head>
<body>
<header class="top">
  <button id="tema" class="texto" aria-label="Cambiar entre modo claro y oscuro"></button>
</header>
<main>
  <section class="intro">
    <h1>Recueil</h1>
    <span class="sello">— Recetas para cocinar con calma —</span>
    <input id="buscar" type="search" placeholder="Busca por plato o ingrediente" aria-label="Buscar recetas" autocomplete="off">
  </section>
  <nav id="cats" class="cats" aria-label="Categorías"></nav>
  <span id="cuenta" class="sello"></span>
  <p id="vacio" class="vacio" hidden>No hay recetas con esa búsqueda. Prueba con otro ingrediente.</p>
  <section id="rejilla" class="rejilla"></section>
</main>
<article id="detalle" class="detalle" hidden aria-modal="true" role="dialog"></article>
<script src="app.js"></script>
</body>
</html>
