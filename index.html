<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recueil</title>
<meta name="description" content="Recueil: recetas para cocinar con calma.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FAF9F6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Lora:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>try{var t=localStorage.getItem('tema')||(matchMedia('(prefers-color-scheme: dark)').matches?'oscuro':'claro');document.documentElement.dataset.tema=t}catch(e){}</script>
</head>
<body>
<header class="top">
  <a class="marca" href="./" aria-label="Recueil, inicio">
    <img src="favicon.svg" alt="" width="40" height="40">
    <span><h1>Recueil</h1><p>Recetas para cocinar con calma</p></span>
  </a>
  <button id="tema" class="icono" aria-label="Cambiar entre modo claro y oscuro"></button>
</header>
<main>
  <input id="buscar" type="search" placeholder="Busca por plato o ingrediente" aria-label="Buscar recetas" autocomplete="off">
  <nav id="cats" class="pildoras" aria-label="Categorías"></nav>
  <p id="vacio" class="vacio" hidden>No hay recetas con esa búsqueda. Prueba con otro ingrediente.</p>
  <section id="rejilla" class="rejilla"></section>
</main>
<article id="detalle" class="detalle" hidden aria-modal="true" role="dialog"></article>
<script src="app.js"></script>
</body>
</html>
