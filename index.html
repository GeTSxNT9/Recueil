<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recueil</title>
<meta name="description" content="Recueil: colección de recetas.">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>try{var t=localStorage.getItem('tema')||(matchMedia('(prefers-color-scheme: dark)').matches?'oscuro':'claro');document.documentElement.dataset.tema=t}catch(e){}</script>
</head>
<body>
<header class="top">
  <button id="tema" class="texto" aria-label="Cambiar entre modo claro y oscuro"></button>
</header>
<main>
  <section class="intro">
    <h1>Recueil</h1>
    <input id="buscar" type="search" placeholder="Busca por plato o ingrediente" aria-label="Buscar recetas" autocomplete="off">
  </section>
  <div class="filtros">
    <button id="abrir-filtros" class="boton"></button>
    <div id="chips" class="chips"></div>
  </div>
  <div class="herramientas">
    <span id="cuenta" class="cuenta"></span>
    <div class="ctrl">
      <label><span class="sr">Ordenar por</span>
        <select id="orden"><option value="volumen">Por volumen</option><option value="az">Nombre A–Z</option><option value="nuevas">Últimas añadidas</option></select>
      </label>
      <div class="vista"><button id="v-rejilla" class="texto" aria-pressed="true">Cuadrícula</button><button id="v-lista" class="texto" aria-pressed="false">Lista</button></div>
    </div>
  </div>
  <p id="vacio" class="vacio" hidden>No hay recetas con esa búsqueda. Prueba con otro ingrediente.</p>
  <section id="rejilla" class="rejilla"></section>
</main>
<div id="panel" class="panel" hidden>
  <div class="velo" id="velo"></div>
  <section class="hoja-filtros" role="dialog" aria-modal="true" aria-label="Filtrar recetas">
    <div class="cuerpo-filtros">
      <div class="sec"><i></i><h3>Volumen</h3><i></i></div>
      <ul id="lista-vol" class="lista-cats"></ul>
      <div id="bloque-etq"><div class="sec"><i></i><h3>Etiquetas</h3><i></i></div><div id="lista-etq" class="etq"></div></div>
    </div>
    <div class="pie-filtros"><button id="borrar" class="texto">Borrar filtros</button><button id="aplicar" class="boton solido"></button></div>
  </section>
</div>
<div id="dialogo" class="panel" hidden>
  <div class="velo" id="velo2"></div>
  <section class="hoja-filtros" role="dialog" aria-modal="true" aria-label="Eliminar receta">
    <div class="cuerpo-filtros">
      <div class="sec"><i></i><h3>Eliminar receta</h3><i></i></div>
      <p id="dlg-msg" class="dlg-texto"></p>
      <label class="campo">Token de GitHub<input id="dlg-token" type="password" autocomplete="off" placeholder="github_pat_…"></label>
      <label class="campo">Repositorio<input id="dlg-repo" type="text" autocomplete="off" placeholder="usuario/repositorio"></label>
      <label class="chk"><input id="dlg-recordar" type="checkbox"> Recordar el token solo en esta sesión del navegador</label>
      <p id="dlg-estado" class="dlg-texto" role="status"></p>
    </div>
    <div class="pie-filtros"><button id="dlg-cancelar" class="texto">Cancelar</button><button id="dlg-ok" class="boton solido">Eliminar definitivamente</button></div>
  </section>
</div>
<article id="detalle" class="detalle" hidden aria-modal="true" role="dialog"></article>
<script src="app.js"></script>
</body>
</html>
